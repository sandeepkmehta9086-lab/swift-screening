$kind: http-request
url: "{{baseUrl}}/v1/lists/status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 array of lists', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 4000
