$kind: http-request
url: "{{baseUrl}}/healthz"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 ok', () => pm.response.to.have.status(200));
      pm.test('status ok', () => pm.expect(pm.response.json().status).to.eql('ok'));
    language: text/javascript
order: 1000
