$kind: http-request
url: "{{baseUrl}}/v1/screen/entity"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Denmonmon Textiles Ltd",
      "country": "SG",
      "entity_type": "organisation"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('decision PASS', () => pm.expect(pm.response.json().decision).to.eql('PASS'));
    language: text/javascript
order: 3000
