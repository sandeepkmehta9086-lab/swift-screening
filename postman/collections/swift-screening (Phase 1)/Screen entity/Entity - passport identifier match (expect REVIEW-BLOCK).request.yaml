$kind: http-request
name: Entity - passport identifier match (expect REVIEW/BLOCK)
url: "{{baseUrl}}/v1/screen/entity"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "V. Kornilov",
      "entity_type": "individual",
      "identifiers": [{ "type": "PASSPORT", "value": "P7731942", "country": "RU" }]
    }
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('not PASS', () => pm.expect(r.decision).to.be.oneOf(['REVIEW', 'BLOCK']));
    language: text/javascript
order: 2000
