[project]
name = "swift-screening"
version = "0.1.0"
description = "Open-source SWIFT MT / ISO 20022 sanctions screening service (decision support)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rapidfuzz>=3.9",
    "jellyfish>=1.1",
    "anyascii>=0.3.2",
    "lxml>=5.3",
    "sqlalchemy>=2.0.30",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
swift-screening = "swift_screening.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "lxml-stubs",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swift_screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "scenario(id): links a test to a scenario ID in Agent.md section 5",
    "perf: performance tests (slower)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
# Seeded PRNG for synthetic test data, never for security.
"src/swift_screening/synth/**" = ["S311"]
"tools/**" = ["S311"]
# Decision.PASS is a screening outcome, not a password.
"src/swift_screening/decision/models.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
